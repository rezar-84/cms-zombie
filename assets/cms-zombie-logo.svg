<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" aria-labelledby="t d">
  <title id="t">CMS Zombie</title>
  <desc id="d">Modern cyber-zombie mascot emerging from a digital shield, beside bold typography for CMS Zombie.</desc>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .shield-border { stroke: url(#neonGlow); stroke-width: 3.5; fill: url(#shieldGrad); }
    .bolt-accent { fill: #F59E0B; filter: drop-shadow(0 0 4px #F59E0B); }
    .head-base { fill: url(#skinGrad); }
    .plate { fill: #334155; stroke: #475569; stroke-width: 2; }
    .eye-neon { fill: #06B6D4; filter: url(#aiGlow); }
    .eye-pupil { fill: #FFFFFF; }
    .stitch { stroke: #047857; stroke-width: 2.5; stroke-linecap: round; }
    .word-cms { fill: #10B981; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
    .word-zombie { fill: #0F172A; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 850; letter-spacing: -0.03em; }
    .tagline { fill: #64748B; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 17px; letter-spacing: -0.01em; }

    @media (prefers-color-scheme: dark) {
      .word-zombie { fill: #F8FAFC; }
      .tagline { fill: #94A3B8; }
    }
  </style>

  <!-- Mascot Icon Badge -->
  <g transform="translate(18, 12)">
    <!-- Hexagonal Shield Foundation -->
    <polygon class="shield-border" points="78,4 142,38 142,118 78,152 14,118 14,38" />

    <!-- Circuit traces on shield -->
    <path d="M26 48 L46 48 L56 60" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.4" />
    <path d="M130 108 L110 108 L100 96" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" />

    <!-- Cyber Zombie Head -->
    <!-- Jaw & Neck -->
    <path class="head-base" d="M48 94 C48 126 108 126 108 94 Z" />
    <!-- Main Cranium -->
    <path class="head-base" d="M44 70 C44 42 112 42 112 70 L112 94 L44 94 Z" />

    <!-- Robotic Cyber Cranial Plating (Right Half) -->
    <path class="plate" d="M78 44 C98 44 112 56 112 72 L112 92 L78 92 Z" />
    <!-- Cyber Screws / Ports -->
    <circle cx="86" cy="52" r="2.5" fill="#64748B" />
    <circle cx="104" cy="62" r="2.5" fill="#64748B" />

    <!-- Organic Stitches on Left Side -->
    <path class="stitch" d="M56 52 L62 62" />
    <path class="stitch" d="M54 57 L64 57" />
    <path class="stitch" d="M50 78 L58 84" />

    <!-- Left Eye (Zombie / Grumpy Stitch) -->
    <circle cx="62" cy="74" r="6" fill="#047857" />
    <circle cx="63" cy="73" r="2" fill="#A7F3D0" />

    <!-- Right Eye (AI Glowing Cyber Optic) -->
    <rect x="88" y="68" width="16" height="12" rx="3" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="96" cy="74" r="4.5" class="eye-neon" />
    <circle cx="96" cy="74" r="1.5" class="eye-pupil" />

    <!-- Grin / Tech Mouth -->
    <path d="M60 104 Q78 114 96 104" fill="none" stroke="#064E3B" stroke-width="3" stroke-linecap="round" />
    <!-- Teeth -->
    <rect x="70" y="104" width="4" height="5" rx="1" fill="#F8FAFC" />
    <rect x="78" y="105" width="4" height="5" rx="1" fill="#F8FAFC" />
    <rect x="86" y="104" width="4" height="5" rx="1" fill="#F8FAFC" />

    <!-- Electric AI Spark Bolt on Corner -->
    <polygon points="128,14 118,34 128,32 120,52 138,28 128,30" class="bolt-accent" />
  </g>

  <!-- Typography Suite -->
  <g transform="translate(186, 0)">
    <!-- CMS Bracketed Tag -->
    <text class="word-cms" x="0" y="88" font-size="50">&lt;CMS&gt;</text>
    
    <!-- Zombie Bold Wordmark -->
    <text class="word-zombie" x="175" y="88" font-size="64">Zombie</text>

    <!-- Subtitle / Value Proposition -->
    <text class="tagline" x="4" y="126">Resurrect Legacy CMS Websites into Modern AI Code</text>

    <!-- Tech Badges below tagline -->
    <g transform="translate(4, 142)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#10B981" opacity="0.15" />
      <text x="38" y="13" text-anchor="middle" fill="#10B981" font-size="10" font-family="ui-monospace, monospace" font-weight="700">WORDPRESS</text>

      <rect x="84" y="0" width="60" height="18" rx="4" fill="#06B6D4" opacity="0.15" />
      <text x="114" y="13" text-anchor="middle" fill="#06B6D4" font-size="10" font-family="ui-monospace, monospace" font-weight="700">DRUPAL</text>

      <rect x="152" y="0" width="64" height="18" rx="4" fill="#8B5CF6" opacity="0.15" />
      <text x="184" y="13" text-anchor="middle" fill="#8B5CF6" font-size="10" font-family="ui-monospace, monospace" font-weight="700">ASTRO AI</text>
    </g>
  </g>
</svg>
